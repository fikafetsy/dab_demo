      configuration:
        customers_catalog: ${var.customers_catalog}
        addresses_catalog: ${var.addresses_catalog}
        orders_catalog: ${var.orders_catalog}
        silver_schema: ${var.silver_schema}

      libraries:
        - glob:
            include: "../src/dab_demo_etl/transformations/create_order_summary.sql"