[project]
name = "dab_demo"
version = "0.0.1"
authors = [{ name = "devbob999@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
    "databricks-connect>=17.0.0,<17.3.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ipykernel",
    "databricks-sdk>=0.84.0",
    "pytest-cov>=7.0.0",
    "pip>=26.0",
    "pyspark==4.0.0",
]

[project.scripts]
main = "dab_demo.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
